name: Build iPad App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install project generator
        run: |
          set -euo pipefail
          brew install xcodegen
      - name: Check geometry and build unsigned IPA
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SpatialPen-unsigned
          path: |
            output/SpatialPen-unsigned.ipa
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 3
