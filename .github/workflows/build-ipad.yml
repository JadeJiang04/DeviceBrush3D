name: Build iPad App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project SpatialPen.xcodeproj -scheme SpatialPen \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/SpatialPen.app output/Payload/
          test -f output/Payload/SpatialPen.app/SpatialPen
          plutil -lint output/Payload/SpatialPen.app/Info.plist
          cd output
          zip -qry SpatialPen-unsigned.ipa Payload
          shasum -a 256 SpatialPen-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialPen-unsigned
          path: |
            output/SpatialPen-unsigned.ipa
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 3
